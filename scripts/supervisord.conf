[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

[program:backend]
command=/usr/local/bin/uvicorn server:app --host 0.0.0.0 --port %(ENV_PORT)s --workers 1 --proxy-headers --forwarded-allow-ips=*
directory=/app/backend
autostart=true
autorestart=true
startsecs=5
stopwaitsecs=15
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=10

[program:baileys]
command=/usr/bin/node /app/whatsapp-sidecar/server.js
directory=/app/whatsapp-sidecar
autostart=true
autorestart=true
startsecs=3
stopwaitsecs=15
stopasgroup=true
killasgroup=true
environment=PORT="3001",WEBHOOK_URL="http://localhost:%(ENV_PORT)s/api/whatsapp/webhook",WEBHOOK_TOKEN="%(ENV_WHATSAPP_WEBHOOK_TOKEN)s"
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=20
